<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RD Fitness Club - Pantalla de Mostrador</title>
  <link rel="icon" href="/logo.svg">
  <script src="/vendor/qrcode.js"></script>
  <style>
    :root {
      --bg: #07090e;
      --bg-card: rgba(15, 23, 42, 0.88);
      --bg-card-border: rgba(245, 180, 0, 0.35);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --gold: #f5b400;
      --gold-glow: rgba(245, 180, 0, 0.28);
      --accent: #38bdf8;
      --topbar-bg: rgba(7, 9, 14, 0.85);
      --topbar-border: rgba(245, 180, 0, 0.2);
      --chip-bg: rgba(255, 255, 255, 0.06);
      --chip-border: rgba(255, 255, 255, 0.12);
      --qr-bg: #ffffff;
      --qr-text: #0f172a;
      --success: #10b981;
    }

    [data-theme="light"] {
      --bg: #faf7fa;
      --bg-card: #ffffff;
      --bg-card-border: #e5dce8;
      --text: #241e26;
      --text-muted: #736878;
      --gold: #b76e79;
      --gold-glow: rgba(183, 110, 121, 0.22);
      --accent: #0284c7;
      --topbar-bg: rgba(255, 255, 255, 0.92);
      --topbar-border: #e5dce8;
      --chip-bg: #f3edf5;
      --chip-border: #e5dce8;
      --qr-bg: #ffffff;
      --qr-text: #241e26;
      --success: #15803d;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      transition: background .25s ease, color .25s ease;
      user-select: none;
    }

    .display-shell {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
      position: relative;
    }

    /* BARRA SUPERIOR */
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 28px;
      background: var(--topbar-bg);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--topbar-border);
      z-index: 20;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .brand img {
      width: 44px;
      height: 44px;
      filter: drop-shadow(0 2px 8px var(--gold-glow));
    }
    .brand-title {
      font-size: 1.35rem;
      font-weight: 900;
      letter-spacing: 0.8px;
      color: var(--gold);
      text-transform: uppercase;
      line-height: 1.1;
    }
    .brand-sub {
      font-size: 0.8rem;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      font-weight: 500;
      margin-top: 2px;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .clock-block {
      text-align: right;
    }
    .clock-time {
      font-size: 1.45rem;
      font-weight: 800;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: var(--text);
      line-height: 1;
    }
    .clock-date {
      font-size: 0.78rem;
      color: var(--text-muted);
      text-transform: capitalize;
      margin-top: 3px;
    }

    .ctrl-btn {
      background: var(--chip-bg);
      border: 1px solid var(--chip-border);
      color: var(--text);
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all .15s ease;
    }
    .ctrl-btn:hover {
      border-color: var(--gold);
      transform: translateY(-1px);
    }
    .ctrl-btn svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }

    /* ESCENARIO PRINCIPAL */
    .stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
    }

    /* ESTADO 1: BIENVENIDA (IDLE) */
    .idle-box {
      text-align: center;
      max-width: 840px;
      animation: fadeIn .4s ease;
    }
    .idle-hero-logo {
      width: 120px;
      height: 120px;
      margin-bottom: 20px;
      filter: drop-shadow(0 0 35px var(--gold-glow));
      animation: pulseBreath 4s infinite ease-in-out;
    }
    .idle-headline {
      font-size: 2.6rem;
      font-weight: 900;
      letter-spacing: -0.5px;
      line-height: 1.15;
      margin-bottom: 12px;
    }
    .idle-headline span {
      color: var(--gold);
    }
    .idle-quote {
      font-size: 1.25rem;
      color: var(--text-muted);
      font-style: italic;
      margin-bottom: 30px;
      line-height: 1.4;
      min-height: 38px;
    }
    .idle-badges {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 34px;
    }
    .chip {
      background: var(--chip-bg);
      border: 1px solid var(--chip-border);
      padding: 9px 16px;
      border-radius: 24px;
      font-size: 0.88rem;
      color: var(--text);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
    }
    .chip svg {
      width: 16px;
      height: 16px;
      stroke: var(--gold);
      fill: none;
      stroke-width: 2;
    }

    .payment-trust-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
      padding-top: 14px;
      border-top: 1px solid var(--chip-border);
    }
    .pay-pill {
      background: var(--chip-bg);
      border: 1px solid var(--chip-border);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .pay-pill.yape { color: #c084fc; border-color: rgba(192, 132, 252, 0.4); }
    .pay-pill.plin { color: #38bdf8; border-color: rgba(56, 189, 248, 0.4); }
    .pay-pill.card { color: var(--gold); border-color: var(--gold-glow); }

    /* ESTADO 2: COBRO ACTIVO (PAYMENT / CARD) */
    .bill-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 40px;
      max-width: 960px;
      width: 100%;
      background: var(--bg-card);
      border: 2px solid var(--bg-card-border);
      border-radius: 24px;
      padding: 38px 44px;
      box-shadow: 0 16px 50px rgba(0, 0, 0, 0.25), 0 0 40px var(--gold-glow);
      animation: popIn .3s ease;
      position: relative;
    }
    .bill-meta {
      flex: 1;
      text-align: left;
    }
    .bill-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--chip-bg);
      border: 1px solid var(--bg-card-border);
      color: var(--gold);
      font-weight: 800;
      font-size: 0.78rem;
      padding: 5px 12px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 14px;
    }
    .bill-title {
      font-size: 1.85rem;
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 6px;
      color: var(--text);
    }
    .bill-sub {
      font-size: 0.92rem;
      color: var(--text-muted);
      margin-bottom: 18px;
    }
    .bill-price-label {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      font-weight: 700;
      margin-bottom: 2px;
    }
    .bill-price {
      font-size: 3.8rem;
      font-weight: 900;
      color: var(--gold);
      letter-spacing: -1px;
      line-height: 1;
      margin-bottom: 22px;
    }
    .bill-instructions {
      background: var(--chip-bg);
      border: 1px solid var(--chip-border);
      border-radius: 14px;
      padding: 14px 18px;
      font-size: 0.9rem;
      line-height: 1.45;
      color: var(--text);
    }
    .bill-instructions b {
      color: var(--gold);
    }

    /* LADO DERECHO: QR CODE BOX */
    .qr-container {
      background: var(--qr-bg);
      border-radius: 20px;
      padding: 22px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      text-align: center;
      width: 270px;
      flex-shrink: 0;
      border: 1px solid rgba(0, 0, 0, 0.08);
    }
    .qr-svg-holder svg {
      width: 226px;
      height: 226px;
      display: block;
      margin: 0 auto;
    }
    .qr-caption {
      color: var(--qr-text);
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      margin-top: 10px;
      text-transform: uppercase;
    }

    /* LADO DERECHO: POS CONTACTLESS NFC ANIMATION */
    .nfc-container {
      background: var(--chip-bg);
      border: 2px dashed var(--bg-card-border);
      border-radius: 20px;
      padding: 28px 22px;
      text-align: center;
      width: 270px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .nfc-wave-ring {
      position: relative;
      width: 90px;
      height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }
    .nfc-pulse {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px solid var(--gold);
      opacity: 0;
      animation: nfcPulse 2.2s infinite ease-out;
    }
    .nfc-pulse:nth-child(2) {
      animation-delay: 0.7s;
    }
    .nfc-center-icon {
      z-index: 2;
      width: 48px;
      height: 48px;
      color: var(--gold);
    }
    .nfc-label {
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--gold);
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    .nfc-sub {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    /* ESTADO 3: ÉXITO */
    .success-box {
      text-align: center;
      max-width: 620px;
      animation: popIn .35s ease;
    }
    .success-ring {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: rgba(16, 185, 129, 0.15);
      border: 3px solid var(--success);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      animation: bounceCheck .7s ease;
    }
    .success-ring svg {
      width: 52px;
      height: 52px;
      stroke: var(--success);
      fill: none;
      stroke-width: 3;
    }
    .success-title {
      font-size: 2.8rem;
      font-weight: 900;
      color: var(--success);
      line-height: 1.1;
      margin-bottom: 12px;
    }
    .success-msg {
      font-size: 1.3rem;
      color: var(--text);
      line-height: 1.4;
      margin-bottom: 24px;
    }
    .success-meter {
      height: 4px;
      background: var(--chip-border);
      border-radius: 2px;
      max-width: 280px;
      margin: 0 auto;
      overflow: hidden;
    }
    .success-meter-bar {
      height: 100%;
      background: var(--success);
      width: 100%;
      animation: countdownBar 5s linear forwards;
    }

    /* ESTADOS DE ACCESO Y ASISTENCIA (BIENVENIDA, SALIDA, DENEGADO) */
    .access-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      max-width: 820px;
      width: 100%;
      background: var(--bg-card);
      border: 2px solid var(--bg-card-border);
      border-radius: 28px;
      padding: 36px 42px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35), 0 0 40px var(--gold-glow);
      animation: popIn .35s ease;
      position: relative;
    }
    .access-card.welcome {
      border-color: rgba(16, 185, 129, 0.5);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35), 0 0 45px rgba(16, 185, 129, 0.25);
    }
    .access-card.goodbye {
      border-color: rgba(56, 189, 248, 0.5);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35), 0 0 45px rgba(56, 189, 248, 0.25);
    }
    .access-card.denied {
      border-color: rgba(239, 68, 68, 0.6);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35), 0 0 45px rgba(239, 68, 68, 0.3);
      animation: shakeCard .45s ease;
    }
    @keyframes shakeCard {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-10px); }
      40%, 80% { transform: translateX(10px); }
    }
    .member-avatar-wrap {
      position: relative;
      margin-bottom: 18px;
    }
    .member-avatar-img {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid var(--gold);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
      display: block;
    }
    .member-avatar-placeholder {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: var(--chip-bg);
      border: 4px solid var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3.5rem;
      font-weight: 900;
      color: var(--gold);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
    }
    .access-card.welcome .member-avatar-img,
    .access-card.welcome .member-avatar-placeholder {
      border-color: var(--success);
      box-shadow: 0 0 30px rgba(16, 185, 129, 0.4);
    }
    .access-card.goodbye .member-avatar-img,
    .access-card.goodbye .member-avatar-placeholder {
      border-color: #38bdf8;
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.4);
    }
    .access-card.denied .member-avatar-img,
    .access-card.denied .member-avatar-placeholder {
      border-color: #ef4444;
      box-shadow: 0 0 30px rgba(239, 68, 68, 0.4);
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 18px;
      border-radius: 30px;
      font-size: 0.95rem;
      font-weight: 900;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    .status-badge.ok {
      background: rgba(16, 185, 129, 0.16);
      color: var(--success);
      border: 1.5px solid var(--success);
    }
    .status-badge.goodbye {
      background: rgba(56, 189, 248, 0.16);
      color: #38bdf8;
      border: 1.5px solid #38bdf8;
    }
    .status-badge.denied {
      background: rgba(239, 68, 68, 0.18);
      color: #ef4444;
      border: 1.5px solid #ef4444;
    }
    .member-name {
      font-size: 2.3rem;
      font-weight: 900;
      line-height: 1.15;
      margin-bottom: 10px;
      letter-spacing: -0.5px;
      color: var(--text);
    }
    .member-details-grid {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }
    .detail-pill {
      background: var(--chip-bg);
      border: 1px solid var(--chip-border);
      padding: 8px 16px;
      border-radius: 12px;
      font-size: 0.92rem;
      color: var(--text);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .detail-pill b { color: var(--gold); }
    .motivational-lead {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
    }
    .motivational-sub {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-bottom: 22px;
    }
    .denied-alert-box {
      background: rgba(239, 68, 68, 0.12);
      border: 2px solid rgba(239, 68, 68, 0.45);
      border-radius: 16px;
      padding: 16px 22px;
      max-width: 640px;
      margin: 12px auto 22px;
      text-align: center;
    }
    .denied-alert-title {
      color: #ef4444;
      font-size: 1.2rem;
      font-weight: 900;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }
    .denied-alert-text {
      color: var(--text);
      font-size: 1.05rem;
      line-height: 1.45;
    }
    .denied-alert-text b {
      color: var(--gold);
    }
    .duration-stat-box {
      background: rgba(56, 189, 248, 0.12);
      border: 1.5px solid rgba(56, 189, 248, 0.35);
      border-radius: 16px;
      padding: 14px 28px;
      display: inline-flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 18px;
    }
    .duration-stat-val {
      font-size: 2.2rem;
      font-weight: 900;
      color: #38bdf8;
      font-family: ui-monospace, monospace;
      line-height: 1;
    }
    .duration-stat-lbl {
      text-align: left;
      font-size: 0.82rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 700;
    }

    /* ANIMACIONES */
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes popIn { from { opacity: 0; transform: scale(0.94); } to { opacity: 1; transform: scale(1); } }
    @keyframes pulseBreath { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    @keyframes nfcPulse {
      0% { transform: scale(0.6); opacity: 0.9; }
      100% { transform: scale(1.6); opacity: 0; }
    }
    @keyframes bounceCheck {
      0% { transform: scale(0.3); opacity: 0; }
      60% { transform: scale(1.15); }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes countdownBar {
      from { width: 100%; }
      to { width: 0%; }
    }

    @media (max-width: 768px) {
      .bill-card { flex-direction: column-reverse; padding: 24px; gap: 20px; }
      .bill-price { font-size: 3rem; }
      .qr-container, .nfc-container { width: 100%; max-width: 240px; }
      .idle-headline { font-size: 2rem; }
      .member-name { font-size: 1.8rem; }
      .access-card { padding: 24px 20px; }
    }
  </style>
</head>
<body>
  <div class="display-shell">
    <header class="topbar">
      <div class="brand">
        <img src="/logo.svg" alt="RD Fitness Club" style="height:42px;width:42px;max-height:42px;max-width:42px;object-fit:contain;flex-shrink:0" width="42" height="42">
        <div>
          <div class="brand-title" id="gym_name">RD FITNESS CLUB</div>
          <div class="brand-sub" id="gym_slogan">DISCIPLINA · CONSTANCIA · RESULTADOS</div>
        </div>
      </div>
      <div class="top-actions">
        <div class="clock-block">
          <div class="clock-time" id="clock_time">--:--:--</div>
          <div class="clock-date" id="clock_date">--</div>
        </div>
        <button class="ctrl-btn" id="soundtoggle" title="Probar o Activar Sonido de Bienvenida" aria-label="Sonido">
          <svg viewBox="0 0 24 24" id="sound_icon"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
        </button>
        <button class="ctrl-btn" id="themetoggle" title="Alternar Modo Claro / Oscuro" aria-label="Tema">
          <svg viewBox="0 0 24 24" id="theme_icon"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        </button>
        <button class="ctrl-btn" id="fsbtn" title="Pantalla completa" aria-label="Pantalla completa">
          <svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
        </button>
      </div>
    </header>

    <main class="stage" id="stage">
      <!-- Contenido reactivo controlado por SSE / REST -->
    </main>
  </div>

  <script>
    (function () {
      const stage = document.getElementById('stage');
      const themeToggle = document.getElementById('themetoggle');
      const themeIcon = document.getElementById('theme_icon');
      const fsBtn = document.getElementById('fsbtn');

      // ---------------- Gestión del Modo Claro / Oscuro ----------------
      function applyTheme(t) {
        document.documentElement.setAttribute('data-theme', t);
        localStorage.setItem('rd_display_theme', t);
        if (t === 'light') {
          themeIcon.innerHTML = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>';
        } else {
          themeIcon.innerHTML = '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>';
        }
      }
      const initialTheme = localStorage.getItem('rd_display_theme') || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      applyTheme(initialTheme);
      themeToggle.onclick = () => {
        const cur = document.documentElement.getAttribute('data-theme');
        applyTheme(cur === 'light' ? 'dark' : 'light');
      };

      // ---------------- Modo Pantalla Completa para Tablet ----------------
      fsBtn.onclick = () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else {
          document.exitFullscreen().catch(() => {});
        }
      };

      // ---------------- Reloj en Tiempo Real (Hora Lima) ----------------
      function updateClock() {
        const now = new Date();
        document.getElementById('clock_time').textContent = now.toLocaleTimeString('es-PE', { hour: '2-digit', minute: '2-digit', second: '2-digit', timeZone: 'America/Lima' });
        document.getElementById('clock_date').textContent = now.toLocaleDateString('es-PE', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', timeZone: 'America/Lima' });
      }
      setInterval(updateClock, 1000);
      updateClock();

      // ---------------- Configuración Pública del Gimnasio ----------------
      fetch('/api/public').then(r => r.json()).then(p => {
        if (p.gym_name) document.getElementById('gym_name').textContent = p.gym_name.toUpperCase();
        if (p.gym_slogan) document.getElementById('gym_slogan').textContent = p.gym_slogan.toUpperCase();
      }).catch(() => {});

      // ---------------- Utilidades ----------------
      const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      const money = n => 'S/ ' + (Number(n) || 0).toFixed(2).replace(/\.00$/, '');

      function qrSvg(text) {
        if (!window.qrcode) return '';
        try {
          const qr = window.qrcode(0, 'M');
          qr.addData(text);
          qr.make();
          const n = qr.getModuleCount();
          let d = '';
          for (let r = 0; r < n; r++) {
            for (let c = 0; c < n; c++) {
              if (qr.isDark(r, c)) d += `M${c + 2} ${r + 2}h1v1h-1z`;
            }
          }
          const s = n + 4;
          return `<svg viewBox="0 0 ${s} ${s}" shape-rendering="crispEdges"><rect width="${s}" height="${s}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
        } catch {
          return '';
        }
      }

      // ---------------- Sistema de Audio con Web Audio API ----------------
      let audioCtx = null;
      function getAudioCtx() {
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) audioCtx = new AudioContextClass();
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume().catch(() => {});
        }
        return audioCtx;
      }

      function unlockAudio() {
        const ctx = getAudioCtx();
        if (ctx && ctx.state === 'suspended') ctx.resume().catch(() => {});
      }
      document.addEventListener('click', unlockAudio);
      document.addEventListener('touchstart', unlockAudio);

      // Chime de Bienvenida (Entrada Autorizada) - Acorde ascendente luminoso
      function beepAdmission() {
        try {
          const ctx = getAudioCtx();
          if (!ctx) return;
          const now = ctx.currentTime;
          const notes = [523.25, 659.25, 783.99]; // C5, E5, G5
          notes.forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + idx * 0.08);
            gain.gain.setValueAtTime(0.001, now + idx * 0.08);
            gain.gain.exponentialRampToValueAtTime(0.28, now + idx * 0.08 + 0.03);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.08 + 0.7);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + idx * 0.08);
            osc.stop(now + idx * 0.08 + 0.7);
          });
        } catch {}
      }

      // Chime de Despedida (Salida Registrada) - Campana suave relajante
      function beepCheckout() {
        try {
          const ctx = getAudioCtx();
          if (!ctx) return;
          const now = ctx.currentTime;
          const notes = [{ f: 783.99, t: 0 }, { f: 523.25, t: 0.16 }]; // G5 -> C5
          notes.forEach(n => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(n.f, now + n.t);
            gain.gain.setValueAtTime(0.001, now + n.t);
            gain.gain.exponentialRampToValueAtTime(0.25, now + n.t + 0.03);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + n.t + 0.85);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + n.t);
            osc.stop(now + n.t + 0.85);
          });
        } catch {}
      }

      // Alerta de Membresía Vencida / Acceso Denegado - Tono claro de advertencia
      function beepDenied() {
        try {
          const ctx = getAudioCtx();
          if (!ctx) return;
          const now = ctx.currentTime;
          const notes = [{ f: 329.63, t: 0 }, { f: 277.18, t: 0.15 }]; // E4 -> C#4
          notes.forEach(n => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(n.f, now + n.t);
            gain.gain.setValueAtTime(0.001, now + n.t);
            gain.gain.exponentialRampToValueAtTime(0.22, now + n.t + 0.04);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + n.t + 0.45);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + n.t);
            osc.stop(now + n.t + 0.45);
          });
        } catch {}
      }

      const soundToggleBtn = document.getElementById('soundtoggle');
      if (soundToggleBtn) {
        soundToggleBtn.onclick = () => {
          unlockAudio();
          beepAdmission();
        };
      }

      function playChime() {
        beepAdmission();
      }

      // ---------------- Carrusel de Citas ----------------
      const QUOTES = [
        "«La disciplina tarde o temprano vencerá al talento.»",
        "«Tu único límite eres tú mismo. ¡A entrenar con todo!»",
        "«El esfuerzo de hoy es la fuerza y salud de tu mañana.»",
        "«Constancia y dedicación: la fórmula de tus mejores resultados.»",
        "«No se trata de ser el mejor, sino de ser mejor que ayer.»"
      ];
      let quoteIdx = 0;
      setInterval(() => {
        quoteIdx = (quoteIdx + 1) % QUOTES.length;
        const qEl = document.getElementById('idle_quote_text');
        if (qEl) {
          qEl.style.opacity = '0';
          setTimeout(() => { qEl.textContent = QUOTES[quoteIdx]; qEl.style.opacity = '1'; }, 300);
        }
      }, 7000);

      let successTimer = null;

      function fmtDuration(mins) {
        const m = Math.max(1, Number(mins) || 1);
        if (m < 60) return `${m} min`;
        const h = Math.floor(m / 60);
        const rem = m % 60;
        return rem > 0 ? `${h}h ${rem}m` : `${h}h`;
      }

      // ---------------- Renderizador de Estados ----------------
      function render(state) {
        if (successTimer) { clearTimeout(successTimer); successTimer = null; }
        const mode = state?.mode || 'idle';

        if (mode === 'idle') {
          stage.innerHTML = `

              <div class="idle-quote" id="idle_quote_text">${QUOTES[quoteIdx]}</div>
              <div class="idle-badges">
                <div class="chip">

                <span class="pay-pill card"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:middle;margin-right:4px"><rect width="20" height="12" x="2" y="6" rx="2"/><circle cx="12" cy="12" r="2"/></svg>Efectivo</span>
              </div>
            </div>`;
        } else if (mode === 'welcome') {
          beepAdmission();
          const name = state.name || 'Socio';
          const plan = state.plan || 'Membresía Activa';
          const end = state.end || state.end_date ? (state.end || state.end_date) : '';
          const daysLeft = state.daysLeft !== undefined && state.daysLeft !== null ? state.daysLeft : null;
          const photo = state.photo;
          const avatarHtml = photo
            ? `<img class="member-avatar-img" src="${esc(photo)}" alt="" onerror="this.outerHTML='<div class=\\'member-avatar-placeholder\\'>${esc(name[0] || 'S')}</div>'">`

          stage.innerHTML = `
            <div class="access-card welcome">
              <div class="status-badge ok">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
                ACCESO AUTORIZADO
              </div>

                ${end ? `<span class="detail-pill"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:middle;margin-right:4px"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>Vence: <b>${esc(end)}</b>${daysLeft !== null ? ` (${daysLeft} días restantes)` : ''}</span>` : ''}
              </div>
              <div class="motivational-sub">${esc(state.reason || '¡Que tengas una excelente sesión de entrenamiento hoy!')}</div>

            </div>`;
          successTimer = setTimeout(() => { render({ mode: 'idle' }); }, 5500);
        } else if (mode === 'goodbye') {
          beepCheckout();
          const name = state.name || 'Socio';
          const dur = fmtDuration(state.duration_min || 0);
          const photo = state.photo;
          const avatarHtml = photo
            ? `<img class="member-avatar-img" src="${esc(photo)}" alt="" onerror="this.outerHTML='<div class=\\'member-avatar-placeholder\\'>${esc(name[0] || 'S')}</div>'">`
            : `<div class="member-avatar-placeholder"><svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></div>`;

          stage.innerHTML = `
            <div class="access-card goodbye">
              <div class="status-badge goodbye">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                SALIDA REGISTRADA
              </div>
              <div class="member-avatar-wrap">${avatarHtml}</div>
              <div class="motivational-lead">¡HASTA PRONTO!</div>
              <div class="member-name">${esc(name)}</div>
              <div class="duration-stat-box">
                <div class="duration-stat-val">${esc(dur)}</div>
                <div class="duration-stat-lbl">Tiempo de entrenamiento hoy en RD Fitness</div>
              </div>
              <div class="motivational-sub">¡Gran entrenamiento! Hidrátate bien y descansa. Te esperamos pronto.</div>
              <div class="success-meter" style="max-width:320px"><div class="success-meter-bar" style="background:#38bdf8"></div></div>
            </div>`;
          successTimer = setTimeout(() => { render({ mode: 'idle' }); }, 5500);
        } else if (mode === 'denied') {
          beepDenied();
          const name = state.name || 'Socio / Visitante';
          const photo = state.photo;
          const avatarHtml = photo
            ? `<img class="member-avatar-img" src="${esc(photo)}" alt="" onerror="this.outerHTML='<div class=\\'member-avatar-placeholder\\' style=\\'color:#ef4444;border-color:#ef4444\\'>${esc(name[0] || '!')}</div>'">`
            : `<div class="member-avatar-placeholder" style="color:#ef4444;border-color:#ef4444"><svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg></div>`;
          const end = state.end || state.end_date || '';
          const reason = state.reason || 'Membresía vencida. Por favor acércate a recepción a renovar tu plan.';

          stage.innerHTML = `
            <div class="access-card denied">
              <div class="status-badge denied">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                ${state.is_daily ? 'PASE DIARIO CADUCADO' : 'MEMBRESÍA VENCIDA'}
              </div>
              <div class="member-avatar-wrap">${avatarHtml}</div>
              <div class="member-name">${esc(name)}</div>
              <div class="denied-alert-box">
                <div class="denied-alert-title">ACCESO NO DISPONIBLE</div>
                <div class="denied-alert-text">
                  ${end ? `Tu plan finalizó el <b>${esc(end)}</b>.<br>` : ''}
                  <b>Por favor acércate a recepción para renovar tu membresía y continuar entrenando.</b>
                </div>
              </div>
              <div class="motivational-sub">${esc(reason)}</div>
              <div class="success-meter" style="max-width:320px"><div class="success-meter-bar" style="background:#ef4444;animation-duration:6.5s"></div></div>
            </div>`;
          successTimer = setTimeout(() => { render({ mode: 'idle' }); }, 6500);
        } else if (mode === 'daily_welcome') {
          beepAdmission();
          const name = state.name || 'Visitante Casual';
          stage.innerHTML = `
            <div class="access-card welcome">
              <div class="status-badge ok">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
                PASE DIARIO VÁLIDO (S/ 5)
              </div>
              <div class="member-avatar-wrap"><div class="member-avatar-placeholder"><svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2z"/></svg></div></div>
              <div class="motivational-lead">¡BIENVENIDO A RD FITNESS CLUB!</div>
              <div class="member-name">${esc(name)}</div>
              <div class="detail-pill" style="margin-bottom:14px">Válido para entrenamiento libre el día de hoy</div>
              <div class="motivational-sub">${esc(state.reason || '¡Disfruta de tu entrenamiento en Chivay!')}</div>
              <div class="success-meter" style="max-width:320px"><div class="success-meter-bar"></div></div>
            </div>`;
          successTimer = setTimeout(() => { render({ mode: 'idle' }); }, 5500);
        } else if (mode === 'card' || (mode === 'payment' && state.method === 'tarjeta')) {
          stage.innerHTML = `
            <div class="bill-card">
              <div class="bill-meta">
                <div class="bill-tag">
                  <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
                  TERMINAL POS ACTIVO
                </div>
                <div class="bill-title">${esc(state.title || 'Cobro con Tarjeta')}</div>
                <div class="bill-sub">Recepción RD Fitness Club</div>
                <div class="bill-price-label">Monto a pagar</div>
                <div class="bill-price">${money(state.amount)}</div>
                <div class="bill-instructions">
                  <b>Acerca tu tarjeta o dispositivo al terminal POS:</b><br>
                  Aceptamos <b>Contactless (sin contacto)</b>, chip, y pagos móviles con <b>Apple Pay</b> y <b>Google Wallet</b>.<br>
                  <small style="opacity:.8;display:block;margin-top:6px">Si tu banco solicita clave PIN de seguridad, ingrésala en el teclado del POS.</small>
                </div>
              </div>
              <div class="nfc-container">
                <div class="nfc-wave-ring">
                  <div class="nfc-pulse"></div>
                  <div class="nfc-pulse"></div>
                  <svg class="nfc-center-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8.32a7.43 7.43 0 0 1 0 7.36"/><path d="M9.46 6.21a11.76 11.76 0 0 1 0 11.58"/><path d="M12.91 4.1a15.91 15.91 0 0 1 0 15.8"/><path d="M16.37 2a20.16 20.16 0 0 1 0 20"/></svg>
                </div>
                <div class="nfc-label">PAGO SIN CONTACTO</div>
                <div class="nfc-sub">Acerca tu tarjeta o celular</div>
                <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:8px">
                  <span class="pay-pill card" style="font-size:0.7rem;padding:3px 7px">VISA</span>
                  <span class="pay-pill card" style="font-size:0.7rem;padding:3px 7px">MASTERCARD</span>
                  <span class="pay-pill card" style="font-size:0.7rem;padding:3px 7px">AMEX</span>
                </div>
              </div>
            </div>`;
        } else if (mode === 'payment') {
          const qrCodeSvg = state.qr_payload ? qrSvg(state.qr_payload) : '';
          stage.innerHTML = `
            <div class="bill-card">
              <div class="bill-meta">
                <div class="bill-tag" style="color:#c084fc;border-color:rgba(192,132,252,0.4)">
                  <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><rect x="7" y="7" width="10" height="10" rx="1.5"/><line x1="7" y1="12" x2="17" y2="12"/></svg>
                  YAPE · PLIN · INTEROPERABLE
                </div>
                <div class="bill-title">${esc(state.title || 'Cobro con QR')}</div>
                <div class="bill-sub">Titular: <b>${esc(state.merchant || 'RD FITNESS CLUB')}</b> · Cel: <b>${esc(state.phone || '982404043')}</b></div>
                <div class="bill-price-label">Monto exacto a transferir</div>
                <div class="bill-price">${money(state.amount)}</div>
                <div class="bill-instructions">
                  <b>Escanea desde tu celular con Yape o Plin:</b><br>
                  El monto exacto de <b>${money(state.amount)}</b> ya está configurado en el código QR.<br>
                  No necesitas digitar número ni monto manualmente.
                </div>
              </div>
              <div class="qr-container">
                <div class="qr-svg-holder">${qrCodeSvg}</div>
                <div class="qr-caption">MONTO EXACTO: ${money(state.amount)}</div>
              </div>
            </div>`;
        } else if (mode === 'cart') {
          stage.innerHTML = `
            <div class="bill-card" style="max-width:720px">
              <div class="bill-meta" style="text-align:center">
                <div class="bill-tag">VENTA EN CURSO</div>
                <div class="bill-title">${esc(state.title || 'Venta en Recepción')}</div>
                <div class="bill-price-label">Total acumulado</div>
                <div class="bill-price">${money(state.amount)}</div>
                <div class="idle-badges" style="justify-content:center;margin-top:14px">
                  ${(state.items || []).map(i => `<span class="chip">${esc(i)}</span>`).join('')}
                </div>
              </div>
            </div>`;
        } else if (mode === 'success') {
          beepAdmission();
          stage.innerHTML = `
            <div class="success-box">
              <div class="success-ring">
                <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
              </div>
              <div class="success-title">¡PAGO REGISTRADO!</div>
              <div class="success-msg">Gracias por tu preferencia.<br><b>¡Que tengas un excelente entrenamiento!</b></div>
              <div class="chip" style="margin-bottom:20px;border-color:var(--success);color:var(--success);font-size:1.1rem;padding:10px 22px">
                Total abonado: ${money(state.amount)}
              </div>
              <div class="success-meter"><div class="success-meter-bar"></div></div>
            </div>`;
          successTimer = setTimeout(() => { render({ mode: 'idle' }); }, 5000);
        }
      }

      // ---------------- Sincronización en Tiempo Real (SSE Stream) ----------------
      function connectSSE() {
        const es = new EventSource('/api/screen/stream');
        es.onmessage = e => {
          try {
            const data = JSON.parse(e.data);
            render(data);
          } catch {}
        };
        es.onerror = () => {
          es.close();
          setTimeout(connectSSE, 3000);
        };
      }

      // Estado inicial
      fetch('/api/screen/state').then(r => r.json()).then(render).catch(() => render({ mode: 'idle' }));
      connectSSE();
    })();
  </script>
