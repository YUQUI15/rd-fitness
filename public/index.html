<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0b0b0d">
  <title>RD Fitness Club - Socio</title>
  <link rel="icon" type="image/svg+xml" href="/logo.svg">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/css/style.css?v=2.6">
  <script>
    (function(){
      var t = localStorage.getItem('rd_theme');
      if (t === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', '#FAF7FA');
      }
    })();
  </script>
</head>
<body>
  <div id="root">
    <div class="empty" style="padding-top:35vh">Iniciando aplicación…</div>
  </div>

  <!-- Librería QR -->
  <script src="/vendor/qrcode.js"></script>
  <!-- Módulos de la aplicación del socio -->
  <script src="/js/common.js?v=2.6"></script>
  <script src="/js/member-hub.js?v=2.6"></script>
  <script src="/js/workout.js?v=2.6"></script>
  <script src="/js/app.js?v=2.6"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (window.RDMemberBoot) window.RDMemberBoot();
    });
  </script>
</body>
</html>
