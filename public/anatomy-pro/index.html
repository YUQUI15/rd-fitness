        const dir = V.norm([tb.c[0] - db.c[0], tb.c[1] - db.c[1], 0]);
        const av = V.norm([d.aimVec[0], d.aimVec[1], 0]);
        if (V.dot(dir, av) < 0.7) err(`${d.id}: directional aimVec does not point toward target device "${d.aimTo}"`);
      }
    }
    // Proportional physical scale hierarchy check across chassis categories
    const CHASSIS_RANKS = { sensor_iot: 1, mesh_node: 2, home_router: 3, modem_cpe: 3, rack_1u: 5, rack_2u: 6, pc_tower: 6, rack_4u_storage: 7 };
    const devList = Object.values(M.devs);
    for (let i = 0; i < devList.length; i++) for (let j = 0; j < devList.length; j++) {
      const a = devList[i], b = devList[j];
      const ra = CHASSIS_RANKS[a.category], rb = CHASSIS_RANKS[b.category];
      if (ra && rb && ra < rb && devVols[a.id] >= devVols[b.id]) {
        err(`scale proportion error: ${a.id} (${a.category}, vol=${Math.round(devVols[a.id])}) must be physically smaller than ${b.id} (${b.category}, vol=${Math.round(devVols[b.id])})`);
      }
    }
    // cables
    for (const c of Object.values(M.cables)) {
      for (let i = 1; i < c.pts.length; i++) {
        const a = c.pts[i - 1], b = c.pts[i];
        const diff = [0, 1, 2].filter((k) => Math.abs(a[k] - b[k]) > 1e-6).length;
        if (diff !== 1) err(`cable ${c.id}: segment ${i} is not axis-aligned (${diff} axes)`);
      }
    }
    // traces: valid paths, narration, and CONTINUITY (each cable/inside hand-off must meet at the same port)
    const T0 = st0;
    for (const t of scene.traces || []) {
      t.steps.forEach((s, i) => { try { const p = stepPath(M, s, T0, 0); if (!p || p.length < 2) err(`trace ${t.id} step ${i}: empty path`); if (!s.text) err(`trace ${t.id} step ${i}: no narration`); } catch (e) { err(`trace ${t.id} step ${i}: ${e.message}`); } });
      const endPort = (s) => { const c = (scene.cables || []).find((x) => x.id === s.cable); return c ? (s.dir < 0 ? c.from : c.to) : null; };
      const startPort = (s) => { const c = (scene.cables || []).find((x) => x.id === s.cable); return c ? (s.dir < 0 ? c.to : c.from) : null; };
      t.steps.forEach((s, i) => {
        const prev = t.steps[i - 1], next = t.steps[i + 1];
        if (s.type === 'cable') {
          if (prev && prev.type === 'inside' && prev.exit && startPort(s) && prev.dev + '.' + prev.exit !== startPort(s)) warn(`trace ${t.id} step ${i}: cable ${s.cable} starts at ${startPort(s)} but previous step exits ${prev.dev}.${prev.exit}`);
          if (next && next.type === 'inside' && next.enter && endPort(s) && next.dev + '.' + next.enter !== endPort(s)) warn(`trace ${t.id} step ${i}: cable ${s.cable} ends at ${endPort(s)} but next step enters ${next.dev}.${next.enter}`);
        }
        if (s.type === 'inside' && s.stages) {
          const dev = M.devs[s.dev];
          const comps = s.stages.map((sid) => (dev.pipeline.find((q) => q.id === sid) || {}).comp);
          if (comps.length > 1 && new Set(s.stages).size !== s.stages.length) warn(`trace ${t.id} step ${i}: repeated stage in ${s.dev}`);
        }
      });
    }
    // informational (never fails the gate): unused ports, cables with no trace coverage
    const usedCables = new Set(); (scene.traces || []).forEach((t) => t.steps.forEach((s) => { if (s.cable) usedCables.add(s.cable); }));
    for (const p of Object.values(M.ports)) if (!p.cable) notes.push(`port ${p.dev}.${p.id} is unconnected (decorative)`);
    for (const c of Object.keys(M.cables)) if (!usedCables.has(c)) notes.push(`cable ${c} is not covered by any trace`);
    return {
      ok: errors.length === 0, errors, warnings, notes,
      stats: {
        items: M.items.length, devices: Object.keys(M.devs).length, environments: Object.keys(M.envs).length,
        cables: Object.keys(M.cables).length, internals: M.items.filter((i) => i.role === 'internal').length,
        pairsChecked: pairs, variants: variants.length, traces: (scene.traces || []).length,
        traceSteps: (scene.traces || []).reduce((a, t) => a + t.steps.length, 0),
        pipelineStages: Object.values(M.devs).reduce((a, d) => a + (d.pipeline || []).length, 0),
      },
    };
  }

  /* ---------- SCENE VALIDATION (friendly schema errors before anything is built) ---------- */
  function validate(scene) {
    const errors = [], warnings = [];
    const e = (m) => errors.push(m), w = (m) => warnings.push(m);
    if (!scene || typeof scene !== 'object') return { errors: ['scene must be an object'], warnings };
    if (!Array.isArray(scene.devices) || !scene.devices.length) { e('scene.devices must be a non-empty array'); return { errors, warnings }; }
    const vec3 = (a) => Array.isArray(a) && a.length === 3 && a.every((x) => typeof x === 'number' && isFinite(x));
    const NEED = { box: ['min', 'size'], obox: ['c', 'size'], cyl: ['c', 'r', 'len'], dish: ['c', 'R', 'depth'], fan: ['c', 'r'] };
    const specCheck = (sp, where) => {
      if (!sp || typeof sp !== 'object') return e(`${where}: spec must be an object`);
      if (sp.fn) return;
      if (sp.type === 'multi') { (sp.parts || []).forEach((p, i) => specCheck(p, `${where}.parts[${i}]`)); return; }
      if (!sp.type) return e(`${where}: missing "type"`);
      if (['line', 'dot', 'text'].includes(sp.type)) return;
      if (!NEED[sp.type]) return e(`${where}: unknown type "${sp.type}" (use box|obox|cyl|dish|fan|multi)`);
      for (const k of NEED[sp.type]) {
        if (sp[k] === undefined) e(`${where}: ${sp.type} needs "${k}"`);
        else if (['min', 'size', 'c'].includes(k) && !vec3(sp[k])) e(`${where}: "${k}" must be [x,y,z] finite numbers`);
        else if (['r', 'len', 'R', 'depth'].includes(k) && !(typeof sp[k] === 'number' && sp[k] > 0)) e(`${where}: "${k}" must be a positive number`);
      }
      if (sp.type === 'box' && vec3(sp.size) && sp.size.some((x) => x <= 0)) e(`${where}: box size must be > 0`);
      if (sp.m && !MATS[sp.m]) e(`${where}: unknown material "${sp.m}" (known: ${Object.keys(MATS).join(', ')})`);
    };
    (scene.environments || []).forEach((ez, zi) => {
      if (!ez || !ez.id) return e(`environments[${zi}]: missing id`);
      (ez.parts || []).forEach((p, pi) => specCheck(p, `environments[${ez.id}].parts[${pi}]`));
    });
    const devIds = new Set(), portRefs = new Set(), stageRefs = new Set();
    scene.devices.forEach((d, di) => {
      const W = `device[${di}]${d && d.id ? ' ' + d.id : ''}`;
      if (!d || typeof d.id !== 'string' || !/^[A-Za-z0-9_]+$/.test(d.id)) return e(`${W}: "id" must match [A-Za-z0-9_]+`);
      if (devIds.has(d.id)) e(`${W}: duplicate device id`); devIds.add(d.id);
      if (!Array.isArray(d.parts) || !d.parts.length) e(`${W}: needs at least one part`);
      (d.parts || []).forEach((p, i) => specCheck(p, `${W}.parts[${i}]${p && p.name ? ' "' + p.name + '"' : ''}`));
      const cids = new Set();
      (d.internals || []).forEach((c, i) => {
        if (!c || !c.id) return e(`${W}.internals[${i}]: missing id`);
        if (cids.has(c.id)) e(`${W}: duplicate internal id ${c.id}`); cids.add(c.id);
        specCheck(c, `${W}.internals[${i}] ${c.id}`);
      });
      const pids = new Set();
      (d.ports || []).forEach((p, i) => {
        if (!p || !p.id) return e(`${W}.ports[${i}]: missing id`);
        if (pids.has(p.id)) e(`${W}: duplicate port id ${p.id}`); pids.add(p.id); portRefs.add(d.id + '.' + p.id);
        if (!vec3(p.p)) e(`${W}.ports[${p.id}]: "p" must be [x,y,z]`);
        if (!vec3(p.n) || Math.abs(V.len(p.n) - 1) > 0.01) e(`${W}.ports[${p.id}]: "n" must be a unit axis vector`);
      });
      const sids = new Set();
      (d.pipeline || []).forEach((s) => { if (sids.has(s.id)) e(`${W}: duplicate stage ${s.id}`); sids.add(s.id); stageRefs.add(d.id + '.' + s.id); if (s.comp && !cids.has(s.comp)) e(`${W}: stage ${s.id} references unknown component ${s.comp}`); });
    });
    const cableIds = new Set();
    (scene.cables || []).forEach((c, i) => {
      if (!c.id) return e(`cable[${i}]: missing id`);
      if (cableIds.has(c.id)) e(`cable ${c.id}: duplicate id`); cableIds.add(c.id);
      if (!c.path) for (const k of ['from', 'to']) if (!portRefs.has(c[k])) e(`cable ${c.id}: ${k} "${c[k]}" is not a known port (device.port)`);
      if (c.m && !MATS[c.m]) e(`cable ${c.id}: unknown material "${c.m}"`);
    });
    const links = scene.links || {};
    for (const [k, l] of Object.entries(links)) if (typeof l.path !== 'function') e(`link ${k}: "path" must be a function returning [[x,y,z],...]`);
    const traceIds = new Set();
    (scene.traces || []).forEach((t) => {
      if (!t.id || !Array.isArray(t.steps) || !t.steps.length) return e(`trace ${t.id || '?'}: needs id and steps[]`);
      if (traceIds.has(t.id)) e(`trace ${t.id}: duplicate id`); traceIds.add(t.id);
      t.steps.forEach((s, i) => {
        const W = `trace ${t.id} step ${i}`;
        if (!['cable', 'link', 'inside', 'hold'].includes(s.type)) return e(`${W}: unknown step type "${s.type}"`);
        if (s.type === 'cable' && !cableIds.has(s.cable)) e(`${W}: unknown cable "${s.cable}"`);
        if (s.type === 'link' && !links[s.link]) e(`${W}: unknown link "${s.link}"`);
        if (s.type === 'inside' || s.type === 'hold') {
          if (!devIds.has(s.dev)) return e(`${W}: unknown device "${s.dev}"`);
          for (const k of ['enter', 'exit']) if (s[k] && !portRefs.has(s.dev + '.' + s[k])) e(`${W}: ${k} port "${s.dev}.${s[k]}" does not exist`);
          (s.stages || []).forEach((sid) => { if (!stageRefs.has(s.dev + '.' + sid)) e(`${W}: stage "${sid}" not in ${s.dev}.pipeline`); });
        }
        if (s.dur !== undefined && !(s.dur > 0)) e(`${W}: dur must be > 0`);
      });
    });
    return { errors, warnings };
  }

  /* ---------- TOPOLOGY (graph derived from cables + links + environments, for docs, diagrams and exports) ---------- */
  function topology(scene) {
    const M = buildModel(scene);
    const nodes = Object.values(M.devs).map((d) => {
      const b = devBounds(M, d.id, scene.state || {}, 0);
      return {
        id: d.id, label: d.short || d.label || d.id, group: d.group || '',
        zone: d.zone || '', location: d.location || '', realSize: d.realSize || '', category: d.category || '', placement: d.placement || '',
        min: b.min, max: b.max, c: b.c,
      };
    });
    const zones = (scene.environments || []).map((ez) => ({
      id: ez.id, label: ez.label || ez.id, subtitle: ez.subtitle || '', kind: ez.kind || 'zone',
      bounds: ez.bounds || [0, 0, 0, 40, 40, 20],
    }));
    const edges = [];
    for (const c of scene.cables || []) {
      const a = (c.from || '').split('.'), b = (c.to || '').split('.');
      const r = M.cables[c.id];
      edges.push({ id: c.id, kind: 'cable', medium: c.m || 'cEth', from: a[0], fromPort: a[1], to: b[0], toPort: b[1], len: r ? r.len : 0, pts: r ? r.pts : [] });
    }
    for (const [id, l] of Object.entries(scene.links || {})) edges.push({ id, kind: 'link', from: l.from || null, to: l.to || null, label: l.label || id, pts: (l.path ? l.path(scene.state || {}) : []) });
    return { nodes, zones, edges, M };
  }

  /* ---------- QUALITY SCORECARD (0-100, so "is it good enough?" is a number, not an opinion) ---------- */
  function scoreCard(scene, report) {
    const s = report.stats || {}, devs = scene.devices.length || 1;
    const avgInt = (s.internals || 0) / devs, avgStg = (s.pipelineStages || 0) / devs;
    const parts = [
      ['Geometry & scale audit (0 errors)', report.errors.length === 0 ? 30 : 0, 30],
      ['Zero warnings', Math.max(0, 10 - report.warnings.length * 2), 10],
      ['Internal anatomy (>=5 parts/device)', Math.min(15, Math.round(15 * Math.min(1, avgInt / 5))), 15],
      ['Process pipelines (>=3 stages/device)', Math.min(10, Math.round(10 * Math.min(1, avgStg / 3))), 10],
      ['End-to-end traces (>=3)', Math.min(10, Math.round(10 * Math.min(1, (s.traces || 0) / 3))), 10],
      ['Trace coverage of cables', (() => { const n = report.notes ? report.notes.filter((x) => /not covered/.test(x)).length : 0; const total = s.cables || 1; return Math.round(10 * (1 - n / total)); })(), 10],
      ['Live controls + telemetry', (scene.controls && scene.controls.length && scene.tick && scene.kpis) ? 10 : (scene.controls && scene.controls.length ? 5 : 0), 10],
      ['Documented devices (desc+specs)', (() => { const ok = scene.devices.filter((d) => d.desc && d.desc.length >= 40 && d.specs && Object.keys(d.specs).length >= 3).length; return Math.round(5 * ok / devs); })(), 5],
    ];
    const score = parts.reduce((a, p) => a + p[1], 0), max = parts.reduce((a, p) => a + p[2], 0);
    return { score: Math.round(100 * score / max), parts: parts.map(([name, got, of]) => ({ name, got, of })) };
  }

        sel.addEventListener('change', () => {
          audio.click();
          state[c.key] = isNaN(Number(sel.value)) ? sel.value : Number(sel.value);
        });
      } else {
        wrap.innerHTML = `
          <div class="a3d-ctrl-top"><span>${esc(c.label)}</span><span class="a3d-ctrl-val">${esc(fmt)}</span></div>
          <input type="range" min="${c.min}" max="${c.max}" step="${c.step || 1}" value="${state[c.key]}" />
        `;
        const inp = wrap.querySelector('input');
        const valEl = wrap.querySelector('.a3d-ctrl-val');
        inp.addEventListener('input', () => {
          state[c.key] = parseFloat(inp.value);
          if (valEl) valEl.textContent = c.fmt ? c.fmt(state[c.key]) : state[c.key];
        });
      }
      ctrlDeck.appendChild(wrap);
      ctrlEls[c.key] = { wrap, spec: c };
    }

    function focusDevice(devId, openIt) {
      const dev = M.devs[devId];
      if (!dev) return;
      emit('select', { device: devId });
      selectedDev = devId;
      selectedComp = null;
      selectedStage = null;

      const b = devBounds(M, devId, state, 0);
      const span = Math.max(b.max[0] - b.min[0], b.max[1] - b.min[1], b.max[2] - b.min[2]);
      cam.goalTarget = b.c.slice();
      cam.goalZoom = clamp(195 / Math.max(span, 26), 1.65, 3.4);

      if (openIt) {
        if (!xrayAll) {
          for (const d of Object.values(M.devs)) d.open = d.id === devId ? 1 : 0;
        } else {
          dev.open = 1;
        }
        audio.open();
      }
      renderSidebar();
    }

    function onTraceStepChanged() {
      emit('trace-step', { trace: activeTraceIdx, step: traceStepIdx });
      const tr = (scene.traces || [])[activeTraceIdx];
      if (!tr) return;
      const step = tr.steps[traceStepIdx];
      if (!step) return;
      if (step.dev && M.devs[step.dev]) {
        selectedDev = step.dev;
        if (autoCutaway || xrayAll) {
          for (const d of Object.values(M.devs)) {
            d.open = (xrayAll || d.id === step.dev) ? 1 : 0;
          }
        }
        if (step.stages && step.stages.length) selectedStage = step.stages[0];
        if (followPacket) {
          const b = devBounds(M, step.dev, state, 0);
          cam.goalTarget = b.c.slice();
          const span = Math.max(b.max[0] - b.min[0], b.max[1] - b.min[1], b.max[2] - b.min[2]);
          cam.goalZoom = clamp(175 / Math.max(span, 28), 1.5, 2.8);
        }
        renderSidebar();
      }
      updateTraceHud();
    }

    function updateTraceHud() {
      const tr = (scene.traces || [])[activeTraceIdx];
      if (!tr) return;
      const step = tr.steps[traceStepIdx];
      if (!step) return;
      traceStepNum.textContent = `${L('step')} ${traceStepIdx + 1} / ${tr.steps.length}`;
      const devLabel = step.dev && M.devs[step.dev] ? (M.devs[step.dev].short || M.devs[step.dev].label) : (step.type === 'cable' ? 'Cable Físico' : 'Enlace Inalámbrico RF');
      traceStepTitle.textContent = `${devLabel} ${step.layer ? '• [' + step.layer + ']' : ''}`;
      traceStepDesc.textContent = step.text || '';
      const pct = ((traceStepIdx + traceStepT) / tr.steps.length) * 100;
      traceFill.style.width = `${clamp(pct, 0, 100).toFixed(1)}%`;
    }

    function renderSidebar() {
      for (const [id, pill] of Object.entries(devPills)) {
        pill.classList.toggle('selected', id === selectedDev);
        pill.classList.toggle('open', M.devs[id].open > 0.5);
      }
      const dev = M.devs[selectedDev];
      if (!dev) return;

      const specsHtml = Object.entries(dev.specs || {}).map(([k, v]) => `
        <div class="a3d-spec"><div class="a3d-spec-k">${esc(k)}</div><div class="a3d-spec-v">${esc(v)}</div></div>
      `).join('');

      const locTxt = dev.location || (dev.zone && M.envs && M.envs[dev.zone] ? M.envs[dev.zone].label : '');
      const locBar = (locTxt || dev.realSize) ? `<div class="a3d-loc-bar">${locTxt ? `<span class="a3d-loc-pill">📍 ${esc(locTxt)}</span>` : ''}${dev.realSize ? `<span class="a3d-loc-pill">📏 ${esc(dev.realSize)}</span>` : ''}</div>` : '';

      devInfoSec.innerHTML = `
        <div class="a3d-sec-head">
          <span class="a3d-sec-kicker">${esc(L('devSel'))}</span>
          <button class="a3d-mini-btn ${dev.open > 0.5 ? 'active' : ''}" id="btnToggleLid">
            ${esc(dev.open > 0.5 ? L('lidOpen') : L('lidClosed'))}
          </button>
        </div>
        <div class="a3d-dev-title">${esc(dev.label || dev.id)}</div>
        ${locBar}
        <div class="a3d-dev-desc">${esc(dev.desc || '')}</div>
        <div class="a3d-specs">${specsHtml}</div>
      `;
      const btnLid = devInfoSec.querySelector('#btnToggleLid');
      if (btnLid) {
        btnLid.addEventListener('click', () => {
          dev.open = dev.open > 0.5 ? 0 : 1;
          if (dev.open > 0.5) audio.open(); else audio.close();
          renderSidebar();
        });
      }

      const stages = dev.pipeline || [];
      pipeSec.innerHTML = `
        <div class="a3d-sec-head">
          <span class="a3d-sec-kicker">${esc(L('pipeHead'))} (${stages.length})</span>
        </div>
        <div class="a3d-pipe-list">
          ${stages.map((s, i) => `
            <div class="a3d-pipe-item ${selectedStage === s.id ? 'active' : ''}" data-stage="${esc(s.id)}" data-comp="${esc(s.comp || '')}" tabindex="0">
              <div class="a3d-pipe-top">
                <span class="a3d-pipe-num">${i + 1}</span>
                <span class="a3d-pipe-name">${esc(s.name)}</span>
              </div>
              <div class="a3d-pipe-desc">${esc(s.desc)}</div>
            </div>
          `).join('')}
        </div>
      `;
      pipeSec.querySelectorAll('.a3d-pipe-item').forEach((el) => {
        el.addEventListener('click', () => {
          audio.step();
          selectedStage = el.getAttribute('data-stage');
          const cId = el.getAttribute('data-comp');
          if (cId) selectedComp = cId;
          dev.open = 1;
          const b = devBounds(M, dev.id, state, 0);
          cam.goalTarget = b.c.slice();
          cam.goalZoom = Math.max(cam.goalZoom, 1.9);
          renderSidebar();
        });
      });

      const comps = dev.internals || [];
      compSec.innerHTML = `
        <div class="a3d-sec-head">
          <span class="a3d-sec-kicker">${esc(L('compHead'))} (${comps.length})</span>
        </div>
        <div class="a3d-comp-list">
          ${comps.map((c) => `
            <div class="a3d-comp-item ${selectedComp === c.id ? 'active' : ''}" data-comp="${esc(c.id)}" tabindex="0">
              <div class="a3d-comp-name"><span>⚙️ ${esc(c.label)}</span></div>
              <div class="a3d-comp-desc">${esc(c.desc)}</div>
            </div>
          `).join('')}
        </div>
      `;
      compSec.querySelectorAll('.a3d-comp-item').forEach((el) => {
        el.addEventListener('click', () => {
          audio.click();
          selectedComp = el.getAttribute('data-comp');
          dev.open = 1;
          const cb = compBounds(M, dev.id, selectedComp, state, 0);
          cam.goalTarget = cb.c.slice();
          cam.goalZoom = Math.max(cam.goalZoom, 2.25);
          renderSidebar();
        });
      });
    }

    /* ===== v2 platform layer: events, export, share, record, tour, keyboard, live data bridge, perf ===== */
    const listeners = {};
    const on = (ev, fn) => { (listeners[ev] = listeners[ev] || []).push(fn); return () => { listeners[ev] = (listeners[ev] || []).filter((f) => f !== fn); }; };
    function emit(ev, data) {
      (listeners[ev] || []).forEach((f) => { try { f(data); } catch (err) { console.error('[anatomy3d] listener error', err); } });
      try { if (window.parent && window.parent !== window) window.parent.postMessage({ type: 'anatomy:event', event: ev, data }, '*'); } catch (err) { /* sandboxed parent: ignore */ }
    }
    const slug = (scene.title || 'anatomy3d').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 48) || 'anatomy3d';
    const toastEl = document.createElement('div');
    toastEl.className = 'a3d-toast';
    toastEl.setAttribute('role', 'status');
    rootEl.appendChild(toastEl);
    let toastT = 0;
    function toast(msg) { toastEl.textContent = msg; toastEl.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove('show'), 2800); }
    function download(name, data, mime) {
      const blob = data instanceof Blob ? data : new Blob([data], { type: mime });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    }

    /* ---- export: PNG / report / BOM / plan ---- */
    function exportPNG() {
      const c = document.createElement('canvas');
      c.width = canvas.width; c.height = canvas.height;
      const g = c.getContext('2d');
      g.drawImage(canvas, 0, 0);
      g.font = `700 ${Math.round(13 * DPR)}px sans-serif`;
      g.fillStyle = 'rgba(230,237,247,0.92)';
      g.fillText(String(scene.title || ''), 16 * DPR, 26 * DPR);
      g.font = `${Math.round(10 * DPR)}px monospace`;
      g.fillStyle = 'rgba(139,155,180,0.9)';
      g.fillText('Anatomy3D · ' + new Date().toISOString().slice(0, 16).replace('T', ' '), 16 * DPR, 42 * DPR);
      c.toBlob((b) => { if (b) { download(slug + '.png', b); toast(L('savedPng')); } }, 'image/png');
    }
    let reportCache = null;
    function getReport() {
      if (reportCache) return reportCache;
      if (!root.Anatomy3DReport) throw new Error('report.js is not loaded');
      reportCache = root.Anatomy3DReport.generate(scene, A, A.audit(scene));
      return reportCache;
    }
    function exportReport(kind) {
      toast(L('generating'));
      setTimeout(() => {
        try {
          const r = getReport();
          if (kind === 'html') download(slug + '-report.html', r.html, 'text/html');
          else if (kind === 'md') download(slug + '-report.md', r.markdown, 'text/markdown');
          else if (kind === 'json') download(slug + '-bom.json', r.json, 'application/json');
          else if (kind === 'svg') download(slug + '-plan.svg', r.svg, 'image/svg+xml');
          toast(L('saved'));
        } catch (err) { console.error(err); toast('Error: ' + err.message); }
      }, 30);
    }

    /* ---- share: a link that reopens this exact view (camera, device, trace step, controls) ---- */
    const b64 = {
      enc: (o) => { const bytes = new TextEncoder().encode(JSON.stringify(o)); let bin = ''; bytes.forEach((b) => { bin += String.fromCharCode(b); }); return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); },
      dec: (t) => { const bin = atob(t.replace(/-/g, '+').replace(/_/g, '/')); return JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, (ch) => ch.charCodeAt(0)))); },
    };
    function getShare() {
      const user = {};
      (scene.controls || []).forEach((c) => { user[c.key] = state[c.key]; });
      const dv = selectedDev && M.devs[selectedDev];
      return { d: selectedDev, c: selectedComp, a: +cam.goalAz.toFixed(3), e: +cam.goalEl.toFixed(3), z: +cam.goalZoom.toFixed(2), t: cam.goalTarget.map((x) => +x.toFixed(1)), tr: activeTraceIdx, st: traceStepIdx, x: xrayAll ? 1 : 0, o: dv && dv.open > 0.5 ? 1 : 0, s: user };
    }
    function applyShare(o, instant) {
      if (!o || typeof o !== 'object') return;
      const num = (v, d) => (typeof v === 'number' && isFinite(v) ? v : d);
      if (typeof o.d === 'string' && M.devs[o.d]) selectedDev = o.d;
      const sd = selectedDev && M.devs[selectedDev];
      selectedComp = sd && typeof o.c === 'string' && (sd.internals || []).some((q) => q.id === o.c) ? o.c : null;
      cam.goalAz = num(o.a, cam.goalAz);
      cam.goalEl = clamp(num(o.e, cam.goalEl), 0.14, 1.42);
      cam.goalZoom = clamp(num(o.z, cam.goalZoom), 0.58, 4.2);
      if (Array.isArray(o.t) && o.t.length === 3 && o.t.every((x) => typeof x === 'number' && isFinite(x))) cam.goalTarget = o.t.slice();
      if (typeof o.tr === 'number' && scene.traces && scene.traces[o.tr]) {
        activeTraceIdx = o.tr; traceSelect.value = String(o.tr);
        traceStepIdx = Math.max(0, Math.min(scene.traces[o.tr].steps.length - 1, Math.floor(num(o.st, 0)))); traceStepT = 0.4;
      }
      xrayAll = o.x === 1; btnXrayAll.classList.toggle('active', xrayAll);
      for (const d of Object.values(M.devs)) d.open = (xrayAll || (d.id === selectedDev && o.o === 1)) ? 1 : 0;
      if (o.s) setState(o.s);
      if (instant) {
        cam.az = cam.goalAz; cam.el = cam.goalEl; cam.zoom = cam.goalZoom; cam.target = cam.goalTarget.slice();
        for (const d of Object.values(M.devs)) d.openT = d.open;
      }
      renderSidebar(); updateTraceHud();
    }
    function shareLink() {
      const url = location.href.split('#')[0] + '#a3d=' + b64.enc(getShare());
      const done = () => toast(L('linkCopied'));
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(done, () => { window.prompt('URL', url); });
      else window.prompt('URL', url);
      try { history.replaceState(null, '', url); } catch (err) { /* file:// or sandboxed frame */ }
      return url;
    }

    /* ---- safe state bridge (only keys that exist in scene.state; primitives only) ---- */
    function setState(o) {
      if (!o || typeof o !== 'object') return;
      for (const [k, v] of Object.entries(o)) {
        if (!Object.prototype.hasOwnProperty.call(scene.state || {}, k) || k.indexOf('__') === 0) continue;
        if (typeof v !== 'number' && typeof v !== 'string' && typeof v !== 'boolean') continue;
        if (typeof v === 'number' && !isFinite(v)) continue;
        state[k] = v;
        const ce = ctrlEls[k];
        if (ce) {
          const el = ce.wrap.querySelector('input,select'); if (el) el.value = String(v);
          const ve = ce.wrap.querySelector('.a3d-ctrl-val'); if (ve) ve.textContent = ce.spec.fmt ? ce.spec.fmt(v) : String(v);
        }
      }
      const pub = {}; for (const k of Object.keys(state)) if (k.indexOf('__') !== 0) pub[k] = state[k];
      emit('state', pub);
    }

    /* ---- video recording of the current process (WebM) ---- */
    let rec = null, recTimer = 0;
    const btnExport = rootEl.querySelector('#btnExport');
    function toggleRecord() {
      if (rec) { try { rec.stop(); } catch (err) { /* already stopped */ } return; }
      if (!canvas.captureStream || typeof MediaRecorder === 'undefined') { toast(L('noRec')); return; }
      const mime = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'].find((m) => MediaRecorder.isTypeSupported(m));
      if (!mime) { toast(L('noRec')); return; }
      const tr = (scene.traces || [])[activeTraceIdx];
      const total = tr ? tr.steps.reduce((a, st) => a + (st.dur || 2.2), 0) : 12;
      const chunks = [];
      rec = new MediaRecorder(canvas.captureStream(30), { mimeType: mime, videoBitsPerSecond: 6000000 });
      rec.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
      rec.onstop = () => { clearTimeout(recTimer); btnExport.classList.remove('rec'); rec = null; download(slug + '.webm', new Blob(chunks, { type: 'video/webm' })); toast(L('recDone')); };
      stopTour();
      traceStepIdx = 0; traceStepT = 0; tracePlaying = true;
      btnPlayPause.textContent = '⏸'; btnPlayPause.classList.add('active');
      followPacket = true; btnFollow.classList.add('active');
      onTraceStepChanged();
      rec.start(250); btnExport.classList.add('rec'); toast(L('recStart'));
      recTimer = setTimeout(() => { if (rec) rec.stop(); }, Math.min(120, total) * 1000 + 600);
    }

    /* ---- guided tour ---- */
    const tour = { on: false, i: -1, t: 0, prevPlay: true };
    const tourBanner = rootEl.querySelector('#tourBanner');
    const btnTour = rootEl.querySelector('#btnTour');
    function tourGo(i) {
      const devs = scene.devices;
      tour.i = (i + devs.length) % devs.length; tour.t = 0;
      const d = devs[tour.i];
      focusDevice(d.id, true);
      selectedStage = d.pipeline && d.pipeline[0] ? d.pipeline[0].id : null;
      renderSidebar();
      tourBanner.hidden = false;
      tourBanner.innerHTML = `<b>${tour.i + 1}/${devs.length} · ${esc(d.short || d.label || d.id)}</b><span>${esc(d.desc || '')}</span>`;
    }
    function startTour() {
      tour.on = true; tour.prevPlay = tracePlaying; tracePlaying = false;
      btnPlayPause.textContent = '▶'; btnPlayPause.classList.remove('active');
      btnTour.classList.add('active');
      tourGo(0);
    }
    function stopTour() {
      if (!tour.on) return;
      tour.on = false; btnTour.classList.remove('active'); tourBanner.hidden = true;
      tracePlaying = tour.prevPlay; btnPlayPause.textContent = tracePlaying ? '⏸' : '▶'; btnPlayPause.classList.toggle('active', tracePlaying);
    }
    btnTour.addEventListener('click', () => { audio.click(); if (tour.on) stopTour(); else startTour(); });

    /* ---- export menu, help, keyboard ---- */
    const menu = rootEl.querySelector('#exportMenu');
    const closeMenu = () => { menu.hidden = true; btnExport.setAttribute('aria-expanded', 'false'); };
    btnExport.addEventListener('click', (e) => { e.stopPropagation(); menu.hidden = !menu.hidden; btnExport.setAttribute('aria-expanded', String(!menu.hidden)); });
    document.addEventListener('click', closeMenu);
    const toggleFs = () => { if (document.fullscreenElement) document.exitFullscreen(); else if (rootEl.requestFullscreen) rootEl.requestFullscreen(); };
    menu.addEventListener('click', (e) => {
      const b = e.target.closest('[data-act]');
      if (!b) return;
      closeMenu(); audio.click();
      const acts = { png: exportPNG, rec: toggleRecord, link: shareLink, html: () => exportReport('html'), md: () => exportReport('md'), json: () => exportReport('json'), svg: () => exportReport('svg'), fs: toggleFs };
      if (acts[b.dataset.act]) acts[b.dataset.act]();
    });
    const helpEl = rootEl.querySelector('#helpOverlay');
    const SHORT = [['Space', 'kPlay'], ['← / →', 'kStep'], ['1 – 9', 'kDev'], ['X', 'kXray'], ['F', 'kFollow'], ['T', 'kTour'], ['R', 'kReset'], ['E', 'kPng'], ['L', 'kLink'], ['P', 'kPerf'], ['M', 'kMute'], ['?', 'kHelp'], ['Esc', 'kClose'], ['Shift + ←↑↓→', 'kOrbit']];
    helpEl.innerHTML = `<div class="a3d-help-card" role="dialog" aria-label="${esc(L('shortcuts'))}"><h3>${esc(L('shortcuts'))}</h3>${SHORT.map(([k, d]) => `<div><kbd>${esc(k)}</kbd><span>${esc(L(d))}</span></div>`).join('')}<button class="a3d-btn" id="helpClose">${esc(L('close'))}</button></div>`;
    helpEl.addEventListener('click', (e) => { if (e.target === helpEl || e.target.id === 'helpClose') helpEl.hidden = true; });
    rootEl.querySelector('#btnHelp').addEventListener('click', (e) => { e.stopPropagation(); helpEl.hidden = !helpEl.hidden; });
    document.addEventListener('keydown', (e) => {
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      const tg = e.target, tag = tg && tg.tagName, k = e.key;
      if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
      if ((k === 'Enter' || k === ' ') && tg && tg.classList && (tg.classList.contains('a3d-pipe-item') || tg.classList.contains('a3d-comp-item'))) { e.preventDefault(); tg.click(); return; }
      if ((k === ' ' || k === 'Enter') && tag === 'BUTTON') return;
      if (e.shiftKey && k.indexOf('Arrow') === 0) {
        stopTour();
        if (k === 'ArrowLeft') cam.goalAz += 0.12;
        if (k === 'ArrowRight') cam.goalAz -= 0.12;
        if (k === 'ArrowUp') cam.goalEl = clamp(cam.goalEl + 0.08, 0.14, 1.42);
        if (k === 'ArrowDown') cam.goalEl = clamp(cam.goalEl - 0.08, 0.14, 1.42);
        e.preventDefault(); return;
      }
      const lk = k.length === 1 ? k.toLowerCase() : k;
      const act = { ' ': '#btnPlayPause', ArrowRight: '#btnNextStep', ArrowLeft: '#btnPrevStep', x: '#btnXrayAll', f: '#btnFollow', t: '#btnTour', r: '#btnReset', m: '#btnMute' }[lk];
      if (act) { e.preventDefault(); rootEl.querySelector(act).click(); return; }
      if (lk === 'e') exportPNG();
      else if (lk === 'l') shareLink();
      else if (lk === 'p') { perfOn = !perfOn; perfEl.hidden = !perfOn; }
      else if (lk === '?' || lk === 'h') helpEl.hidden = !helpEl.hidden;
      else if (lk === 'Escape') { helpEl.hidden = true; closeMenu(); stopTour(); }
      else if (/^[1-9]$/.test(lk)) { const d = scene.devices[+lk - 1]; if (d) { stopTour(); focusDevice(d.id, true); } }
    });

    /* ---- host integration: postMessage commands + optional live data feed (digital-twin bridge) ---- */
    function handleCmd(m) {
      if (!m || typeof m !== 'object') return;
      if (m.state) setState(m.state);
      if (typeof m.select === 'string' && M.devs[m.select]) focusDevice(m.select, m.open !== false);
      if (typeof m.xray === 'boolean' && m.xray !== xrayAll) btnXrayAll.click();
      if (typeof m.trace === 'number' && scene.traces && scene.traces[m.trace]) { traceSelect.value = String(m.trace); traceSelect.dispatchEvent(new Event('change')); }
      if (typeof m.play === 'boolean' && m.play !== tracePlaying) btnPlayPause.click();
      if (m.share) applyShare(m.share);
      if (m.tour === true && !tour.on) startTour();
      if (m.tour === false) stopTour();
    }
    window.addEventListener('message', (e) => { const m = e.data; if (m && m.type === 'anatomy:set') handleCmd(m); });
    const wsUrl = qp.get('ws');
    if (wsUrl && /^wss?:\/\//.test(wsUrl)) {
      try {
        const ws = new WebSocket(wsUrl);
        ws.onopen = () => toast('Live ● ' + wsUrl);
        ws.onmessage = (e) => { try { handleCmd(JSON.parse(e.data)); } catch (err) { console.warn('[anatomy3d] ignored malformed live message'); } };
        ws.onclose = () => toast('Live ○ disconnected');
      } catch (err) { console.warn('[anatomy3d] websocket failed', err); }
    }

    /* ---- performance monitor + adaptive quality ---- */
    const perfEl = rootEl.querySelector('#perfHud');
    let perfOn = false, emaDt = 1 / 60, lowT = 0, hiT = 0;
    function tickExtras(now, dt) {
      emaDt += (dt - emaDt) * 0.05;
      const fps = 1 / emaDt;
      if (fps < 24) { lowT += dt; hiT = 0; } else if (fps > 52) { hiT += dt; lowT = 0; } else { lowT = 0; hiT = 0; }
      if (!lowQ && lowT > 3) { lowQ = true; resize(); toast(L('lowQ')); lowT = 0; }
      else if (lowQ && hiT > 8) { lowQ = false; resize(); hiT = 0; }
      if (perfOn) perfEl.textContent = `${fps.toFixed(0)} fps · ${(emaDt * 1000).toFixed(1)} ms · ${M.items.length} items · ${lowQ ? 'Q:low' : 'Q:full'} · DPR ${DPR}`;
      if (tour.on) {
        const d = scene.devices[tour.i];
        tour.t += dt; cam.goalAz += dt * 0.09;
        const st = (d && d.pipeline) || [];
        if (st.length) { const id = st[Math.floor(tour.t / 1.8) % st.length].id; if (id !== selectedStage) { selectedStage = id; renderSidebar(); } }
        if (tour.t > 8.5) tourGo(tour.i + 1);
      }
    }

    const app = { M, state, cam, focusDevice, setState, command: handleCmd, on, getShare, applyShare, shareLink, exportPNG, exportReport, toggleRecord, startTour, stopTour, version: '2.0.0' };

    // URL query parameter support for instant deep-linking & verification
    const params = new URLSearchParams(window.location.search || '');
    if (params.get('dev') && M.devs[params.get('dev')]) selectedDev = params.get('dev');
    if (params.get('focus') && M.devs[params.get('focus')]) selectedDev = params.get('focus');

    if (params.get('xray') === '1') {
      xrayAll = true;
      btnXrayAll.classList.add('active');
      for (const d of Object.values(M.devs)) { d.open = 1; d.openT = 1; }
    } else if (params.get('closed') === '1') {
      autoCutaway = false;
      btnAutoCut.classList.remove('active');
      for (const d of Object.values(M.devs)) { d.open = 0; d.openT = 0; }
    } else if (selectedDev && autoCutaway) {
      for (const d of Object.values(M.devs)) {
        d.open = d.id === selectedDev ? 1 : 0;
        d.openT = d.open;
      }
    }
    if (params.get('focus') && M.devs[params.get('focus')]) {
      const fId = params.get('focus');
      const b = devBounds(M, fId, state, 0);
      const span = Math.max(b.max[0] - b.min[0], b.max[1] - b.min[1], b.max[2] - b.min[2]);
      cam.target = b.c.slice(); cam.goalTarget = b.c.slice();
      cam.zoom = clamp(210 / Math.max(span, 26), 1.85, 3.4);
      cam.goalZoom = cam.zoom;
    }
    if (qp.get('embed') === '1') rootEl.classList.add('embed');
    if (qp.get('perf') === '1') { perfOn = true; perfEl.hidden = false; }
    if (qp.get('trace') !== null && scene.traces && scene.traces[+qp.get('trace')]) { activeTraceIdx = +qp.get('trace'); traceSelect.value = String(activeTraceIdx); traceStepIdx = Math.max(0, Math.min((scene.traces[activeTraceIdx].steps.length - 1), +qp.get('step') || 0)); traceStepT = 0.4; }
    if (qp.get('pause') === '1') { tracePlaying = false; btnPlayPause.textContent = '▶'; btnPlayPause.classList.remove('active'); }
    if (/^#a3d=/.test(location.hash || '')) { try { applyShare(b64.dec(location.hash.slice(5)), true); } catch (err) { console.warn('[anatomy3d] invalid share link', err); } }
    btnPlayPause.textContent = tracePlaying ? '⏸' : '▶';
    btnPlayPause.classList.toggle('active', tracePlaying);
    renderSidebar();
    updateTraceHud();

    /* ---------- Pointer / Orbit / Zoom / Hit-Testing ---------- */
    let dragging = false, dragMoved = false, dragBtn = 0, lastX = 0, lastY = 0;
    let screenPolys = [];
    let screenPins = [];

    const ptrs = new Map();
    let pinch0 = null, downX = 0, downY = 0;
    canvas.style.touchAction = 'none';
    canvas.addEventListener('pointerdown', (e) => {
      try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* synthetic pointer */ }
      ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
      stopTour();
      if (ptrs.size === 1) { dragMoved = false; dragBtn = e.button; downX = e.clientX; downY = e.clientY; }
      if (ptrs.size === 2) { dragMoved = true; pinch0 = null; }
    });
    canvas.addEventListener('pointermove', (e) => {
      const p = ptrs.get(e.pointerId);
      if (!p) return;
      const dx = e.clientX - p.x, dy = e.clientY - p.y;
      p.x = e.clientX; p.y = e.clientY;
      if (ptrs.size === 1) {
        if (!dragMoved && Math.hypot(e.clientX - downX, e.clientY - downY) < 4) return;
        dragMoved = true;
        if (dragBtn === 2 || e.shiftKey) {
          const basis = cameraBasis(cam.az, cam.el);
          const scale = 1 / (cam.zoom * 2.2);
          cam.goalTarget = V.add(cam.goalTarget, V.add(V.mul(basis.r, -dx * scale), V.mul(basis.u, dy * scale)));
        } else {
          cam.goalAz -= dx * 0.0065;
          cam.goalEl = clamp(cam.goalEl + dy * 0.0055, 0.14, 1.42);
        }
      } else if (ptrs.size === 2) {
        const [a, b] = [...ptrs.values()];
        const d = Math.hypot(a.x - b.x, a.y - b.y), cx2 = (a.x + b.x) / 2, cy2 = (a.y + b.y) / 2;
        if (pinch0 && pinch0.d > 8) {
          cam.goalZoom = clamp(cam.goalZoom * (d / pinch0.d), 0.58, 4.2);
          const basis = cameraBasis(cam.az, cam.el), scale = 1 / (cam.zoom * 2.2);
          cam.goalTarget = V.add(cam.goalTarget, V.add(V.mul(basis.r, -(cx2 - pinch0.cx) * scale), V.mul(basis.u, (cy2 - pinch0.cy) * scale)));
          if (autoCutaway && cam.goalZoom > 1.32 && selectedDev && M.devs[selectedDev] && M.devs[selectedDev].open < 1) { M.devs[selectedDev].open = 1; renderSidebar(); }
        }
        pinch0 = { d, cx: cx2, cy: cy2 };
      }
    });
    const endPtr = (e) => {
      if (!ptrs.has(e.pointerId)) return;
      const wasSingle = ptrs.size === 1;
      ptrs.delete(e.pointerId);
      if (ptrs.size < 2) pinch0 = null;
      if (wasSingle && !dragMoved && e.type === 'pointerup') handleCanvasClick(e);
      if (ptrs.size === 0) dragMoved = false;
    };
    canvas.addEventListener('pointerup', endPtr);
    canvas.addEventListener('pointercancel', endPtr);
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());
    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      stopTour();
      const factor = Math.exp(-e.deltaY * 0.0012);
      cam.goalZoom = clamp(cam.goalZoom * factor, 0.58, 4.2);

      // Semantic Zoom: auto-open nearest device when zooming in
      if (autoCutaway && cam.goalZoom > 1.32 && selectedDev && M.devs[selectedDev]) {
        M.devs[selectedDev].open = 1;
        renderSidebar();
      }
    }, { passive: false });

    function pointInPoly(px, py, pts) {
      let inside = false;
      for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
        const xi = pts[i][0], yi = pts[i][1], xj = pts[j][0], yj = pts[j][1];
        if (((yi > py) !== (yj > py)) && (px < ((xj - xi) * (py - yi)) / (yj - yi + 1e-9) + xi)) inside = !inside;
      }
      return inside;
    }

    function handleCanvasClick(e) {
      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left, my = e.clientY - rect.top;

      for (let i = screenPins.length - 1; i >= 0; i--) {
        const pin = screenPins[i];
        if (mx >= pin.x0 && mx <= pin.x1 && my >= pin.y0 && my <= pin.y1) {
          audio.step();
          selectedDev = pin.dev;
          if (pin.comp) selectedComp = pin.comp;
          if (pin.stage) selectedStage = pin.stage;
          if (pin.focus) {
            focusDevice(pin.dev, true);
          } else {
            M.devs[pin.dev].open = 1;
            renderSidebar();
          }
          return;
        }
      }

      for (let i = screenPolys.length - 1; i >= 0; i--) {
        const sp = screenPolys[i];
        if (!sp.dev) continue;
        if (pointInPoly(mx, my, sp.pts)) {
          audio.click();
          if (sp.comp) {
            selectedDev = sp.dev;
            selectedComp = sp.comp;
            M.devs[sp.dev].open = 1;
            renderSidebar();
          } else {
            focusDevice(sp.dev, true);
          }
          return;
        }
      }
    }

    /* ---------- Resize Handling ---------- */
    let W = 800, H = 600, DPR = 1;
    function resize() {
      const rect = canvas.parentElement.getBoundingClientRect();
      W = Math.max(300, rect.width);
      H = Math.max(240, rect.height);
      DPR = Math.min(window.devicePixelRatio || 1, lowQ ? 1 : 2);
      canvas.width = Math.round(W * DPR);
      canvas.height = Math.round(H * DPR);
      bgGrad = null;
    }
    window.addEventListener('resize', resize);
    resize();

    /* ---------- Main Simulation & Render Loop ---------- */
    let lastTime = performance.now() * 0.001;
    let kpiTimer = 999;

    function tick(nowMs) {
      const now = nowMs * 0.001;
      const dt = clamp(now - lastTime, 0.001, 0.1);
      lastTime = now;

      const tel = scene.tick ? scene.tick(state, now, dt, A) : {};
      tickExtras(now, dt);

      const kCam = 1 - Math.exp(-dt * 9);
      cam.az = lerp(cam.az, cam.goalAz, kCam);
      cam.el = lerp(cam.el, cam.goalEl, kCam);
      cam.zoom = lerp(cam.zoom, cam.goalZoom, kCam);
      for (let i = 0; i < 3; i++) cam.target[i] = lerp(cam.target[i], cam.goalTarget[i], kCam);

      for (const d of Object.values(M.devs)) {
        const goal = xrayAll ? 1 : d.open;
        d.openT = lerp(d.openT, goal, 1 - Math.exp(-dt * 8));
      }

      const tr = (scene.traces || [])[activeTraceIdx];
      let activePacketPos = null, activeStepPts = null, activeStep = null;
      if (tr && tr.steps.length) {
        activeStep = tr.steps[traceStepIdx] || tr.steps[0];
        const dur = activeStep.dur || 2.2;
        if (tracePlaying) {
          traceStepT += dt / dur;
          if (traceStepT >= 1) {
            traceStepT = 0;
            traceStepIdx = (traceStepIdx + 1) % tr.steps.length;
            activeStep = tr.steps[traceStepIdx];
            if (followPacket || autoCutaway) onTraceStepChanged();
          }
          updateTraceHud();
        }
        try {
          activeStepPts = stepPath(M, activeStep, state, now);
          activePacketPos = polyAt(activeStepPts, traceStepT);
        } catch (e) {}
      }

      kpiTimer += dt;
      if (kpiTimer > 0.15) {
        kpiTimer = 0;
        if (scene.kpis) {
          const list = scene.kpis(state, tel);
          kpiBar.innerHTML = list.map((k) => `
            <div class="a3d-kpi">
              <div class="a3d-kpi-k">${esc(k.label)}</div>
              <div class="a3d-kpi-v ${/^(good|warn|bad)$/.test(k.tone) ? k.tone : ''}">${esc(k.value)}</div>
            </div>
          `).join('');
        }
        if (scene.readout) readoutHud.textContent = scene.readout(state, tel);
      }

      renderFrame(now, tel, activeStep, activeStepPts, activePacketPos);
      requestAnimationFrame(tick);
    }

    function renderFrame(time, tel, activeStep, activeStepPts, activePacketPos) {
      ctx.save();
      ctx.scale(DPR, DPR);
      if (!bgGrad) { bgGrad = ctx.createRadialGradient(W * 0.5, H * 0.45, 0, W * 0.5, H * 0.45, Math.max(W, H) * 0.8); bgGrad.addColorStop(0, '#131c2b'); bgGrad.addColorStop(1, '#06090e'); }
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, W, H);

      const basis = cameraBasis(cam.az, cam.el);
      const baseScale = Math.min(W, H) / (scene.worldSpan || 380);
      const S = baseScale * cam.zoom;
      const cx = W * 0.48, cy = H * 0.55;

      function proj(p) {
        const d = V.sub(p, cam.target);
        return [
          cx + V.dot(d, basis.r) * S,
          cy - V.dot(d, basis.u) * S,
          V.dot(d, basis.v),
        ];
      }

      drawGroundGrid(proj);

      const evs = [];
      for (const it of M.items) {
        if (!visible(M, it)) continue;
        evs.push(evalItem(M, it, state, time));
      }
      const sorted = sortItems(evs, basis.v);

      screenPolys = [];
      screenPins = [];

      // Draw exploded mechanical guide lines for lifted lids
      if (!lowQ) drawExplodeGuides(evs, proj);

      // Draw sorted 3D solids
      for (const ev of sorted) {
        const it = ev.it;
        const dev = it.dev ? M.devs[it.dev] : null;
        const isSelDev = dev && dev.id === selectedDev;
        const isSelComp = it.role === 'internal' && isSelDev && it.comp === selectedComp;

        let alphaMul = 1;
        if (dev && dev.openT > 0.02) {
          if (it.lid) alphaMul = Math.max(0.14, 1 - 0.78 * dev.openT);
          else if (it.enc && it.spec.cutaway !== false) alphaMul = Math.max(0.24, 1 - 0.62 * dev.openT);
        }

        const faces = ev.g.faces.map((f) => {
          const pts3 = f.p.map((p) => V.add(p, ev.off));
          let cz = 0;
          const pts2 = pts3.map((p) => { const q = proj(p); cz += q[2]; return q; });
          cz /= pts3.length;
          return { f, pts3, pts2, cz };
        });
        faces.sort((a, b) => a.cz - b.cz);

        for (const { f, pts2 } of faces) {
          const ndotv = V.dot(f.n, basis.v);
          if (!f.front && !f.back && ndotv < -0.18 && alphaMul > 0.95) continue;

          const col = colorOf(f.sp || it.spec, { state, time, dev, M });
          const a = clamp((col.a !== undefined ? col.a : 1) * alphaMul, 0.05, 1);

          const ndotl = Math.max(0, V.dot(f.n, basis.L));
          const rim = Math.pow(1 - Math.max(0, Math.abs(ndotv)), 2) * 0.16;
          let lit = 0.44 + 0.52 * ndotl + rim + (col.em || 0) * 0.55;
          if (isSelComp) lit += 0.3;

          const r = clamp(Math.round(col.c[0] * lit), 0, 255);
          const g = clamp(Math.round(col.c[1] * lit), 0, 255);
          const b = clamp(Math.round(col.c[2] * lit), 0, 255);

          ctx.beginPath();
          ctx.moveTo(pts2[0][0], pts2[0][1]);
          for (let k = 1; k < pts2.length; k++) ctx.lineTo(pts2[k][0], pts2[k][1]);
          ctx.closePath();

          ctx.fillStyle = `rgba(${r},${g},${b},${a.toFixed(3)})`;
          ctx.fill();

          if (!f.seam || a < 0.45) {
            ctx.strokeStyle = isSelComp
              ? 'rgba(55, 255, 154, 0.95)'
              : isSelDev && it.role === 'shell'
              ? 'rgba(39, 230, 255, 0.45)'
              : `rgba(8, 12, 18, ${(0.42 * a).toFixed(2)})`;
            ctx.lineWidth = isSelComp ? 1.5 : 0.75;
            ctx.stroke();
          }

          if (it.dev && a > 0.2) {
            screenPolys.push({ pts: pts2, dev: it.dev, comp: it.comp || null });
          }
        }

        for (const l of ev.g.lines) {
          const col = colorOf(l.sp, { state, time, dev, M });
          const pts2 = l.pts.map((p) => proj(V.add(p, ev.off)));
          ctx.beginPath();
          ctx.moveTo(pts2[0][0], pts2[0][1]);
          for (let k = 1; k < pts2.length; k++) ctx.lineTo(pts2[k][0], pts2[k][1]);
          ctx.strokeStyle = `rgba(${col.c[0]},${col.c[1]},${col.c[2]},${col.a !== undefined ? col.a : 1})`;
          ctx.lineWidth = (l.sp.w || 1.2) * Math.sqrt(cam.zoom);
          ctx.stroke();
        }

        for (const d of ev.g.dots) {
          const col = colorOf(d.sp, { state, time, dev, M });
          const p2 = proj(V.add(d.p, ev.off));
          ctx.beginPath();
          ctx.arc(p2[0], p2[1], Math.max(1.5, d.r * S * 0.45), 0, Math.PI * 2);
          ctx.fillStyle = `rgba(${col.c[0]},${col.c[1]},${col.c[2]},${col.a !== undefined ? col.a : 1})`;
          ctx.fill();
        }
      }

      drawStationBanners(proj);
      drawWirelessLinks(proj, S, time, tel);
      drawCablePulses(proj, S, time);
      drawAllPipelinesAndLabels(proj, S, time);

      if (activeStepPts && activePacketPos) {
        drawActiveTrace(activeStep, activeStepPts, activePacketPos, proj, S, time);
      }

      ctx.restore();
    }

    function drawExplodeGuides(evs, proj) {
      ctx.save();
      ctx.strokeStyle = 'rgba(39, 230, 255, 0.35)';
      ctx.lineWidth = 1;
      ctx.setLineDash([3, 3]);
      for (const ev of evs) {
        if (!ev.it.lid) continue;
        const dev = M.devs[ev.it.dev];
        if (!dev || dev.openT < 0.1) continue;
        const mn0 = ev.g.aabb.min, mx0 = ev.g.aabb.max;
        const corners = [
          [mn0[0], mn0[1], mn0[2]],
          [mx0[0], mn0[1], mn0[2]],
          [mx0[0], mx0[1], mn0[2]],
          [mn0[0], mx0[1], mn0[2]],
        ];
        for (const c of corners) {
          const a = proj(c);
          const b = proj(V.add(c, ev.off));
          ctx.beginPath();
          ctx.moveTo(a[0], a[1]);
          ctx.lineTo(b[0], b[1]);
          ctx.stroke();
        }
      }
      ctx.setLineDash([]);
      ctx.restore();
    }

    function drawGroundGrid(proj) {
      ctx.save();
      ctx.strokeStyle = 'rgba(65, 95, 135, 0.11)';
      ctx.lineWidth = 1;
      const step = 30, ext = 250;
      for (let x = -ext; x <= ext; x += step) {
        const a = proj([x, -120, -6]), b = proj([x, 120, -6]);
        ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
      }
      for (let y = -120; y <= 120; y += step) {
        const a = proj([-ext, y, -6]), b = proj([ext, y, -6]);
        ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
      }
      ctx.restore();
    }

    function drawStationBanners(proj) {
      if (cam.zoom > 1.85) return;
      const banners = scene.banners || [];
      ctx.save();
      ctx.font = '700 10.5px "JetBrains Mono", monospace';
      for (const b of banners) {
        const off = A.groupOffset(M, b.group, state);
        const p2 = proj(V.add(b.pos, off));
        const tw = ctx.measureText(b.text).width + 16;
        ctx.fillStyle = 'rgba(8, 12, 19, 0.88)';
        ctx.strokeStyle = b.color;
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.roundRect(p2[0] - tw / 2, p2[1] - 10, tw, 20, 4);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = b.color;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(b.text, p2[0], p2[1]);
      }
      ctx.restore();
    }

    function drawWirelessLinks(proj, S, time, tel) {
      for (const [id, link] of Object.entries(M.links)) {
        const pts = link.path(state);
        if (!pts || pts.length < 2) continue;
        const A3 = pts[0], B3 = pts[pts.length - 1];
        const a2 = proj(A3), b2 = proj(B3);

        ctx.save();
        if (link.fresnel !== false) {
          const rings = lowQ ? 0 : 8;
          for (let i = 1; i < rings; i++) {
            const u = i / rings;
            const c3 = V.mix(A3, B3, u);
            const rF = Math.sin(u * Math.PI) * (link.radius || 14);
            const ringPts = [];
            const segs = 24;
            const [ex, ey] = A.basisOf(V.sub(B3, A3));
            for (let k = 0; k <= segs; k++) {
              const ang = (k / segs) * Math.PI * 2;
              const p = V.add(c3, V.add(V.mul(ex, Math.cos(ang) * rF), V.mul(ey, Math.sin(ang) * rF * 0.65)));
              ringPts.push(proj(p));
            }
            ctx.beginPath();
            ctx.moveTo(ringPts[0][0], ringPts[0][1]);
            for (let k = 1; k < ringPts.length; k++) ctx.lineTo(ringPts[k][0], ringPts[k][1]);
            ctx.strokeStyle = 'rgba(39, 230, 255, 0.18)';
            ctx.lineWidth = 1;
            ctx.stroke();
          }
        }

        ctx.beginPath();
        ctx.moveTo(a2[0], a2[1]);
        ctx.lineTo(b2[0], b2[1]);
        ctx.strokeStyle = link.color || 'rgba(39, 230, 255, 0.6)';
        ctx.lineWidth = 1.8;
        ctx.setLineDash([6, 5]);
        ctx.stroke();
        ctx.setLineDash([]);

        const count = link.pulses || 6;
        for (let i = 0; i < count; i++) {
          const u = ((time * 0.55 + i / count) % 1);
          const p3 = V.mix(A3, B3, u);
          const p2 = proj(p3);
          ctx.beginPath();
          ctx.arc(p2[0], p2[1], 3.2, 0, Math.PI * 2);
          ctx.fillStyle = link.pulseColor || '#27e6ff';
          ctx.fill();
        }
        ctx.restore();
      }
    }

    function drawCablePulses(proj, S, time) {
      ctx.save();
      for (const c of Object.values(M.cables)) {
        const off = A.groupOffset(M, c.group, state);
        const pts = c.pts.map((p) => V.add(p, off));
        for (let k = 0; k < 2; k++) {
          const u = (time * 0.65 + k * 0.5) % 1;
          const p3 = polyAt(pts, u);
          const p2 = proj(p3);
          ctx.beginPath();
          ctx.arc(p2[0], p2[1], 2.4, 0, Math.PI * 2);
          ctx.fillStyle = '#37ff9a';
          ctx.fill();
        }
      }
      ctx.restore();
    }

    function drawAllPipelinesAndLabels(proj, S, time) {
      ctx.save();
      const labelCandidates = [];

      for (const dev of Object.values(M.devs)) {
        const isSel = dev.id === selectedDev;
        const b = devBounds(M, dev.id, state, 0);
        const topAnchor = proj([b.c[0], b.c[1], b.max[2] + (dev.openT > 0.3 ? dev.lift * 0.55 : 5)]);
        const onScreen = topAnchor[0] > 30 && topAnchor[0] < W - 30 && topAnchor[1] > 40 && topAnchor[1] < H - 30;

        // Device Header Pill (only if on screen)
        if (onScreen) {
          ctx.font = `700 ${isSel ? 11 : 10}px Inter, sans-serif`;
          const devTxt = dev.short || dev.label || dev.id;
          const devW = ctx.measureText(devTxt).width + 14;
          labelCandidates.push({
            kind: 'dev',
            dev: dev.id,
            text: devTxt,
            ax: topAnchor[0],
            ay: topAnchor[1],
            x: topAnchor[0] - devW / 2,
            y: topAnchor[1] - 22,
